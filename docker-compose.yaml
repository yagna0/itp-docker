services:
  http-svc:
    image: nginx:alpine3.21
    container_name: http-c
    ports:
      - 8089:80
    volumes:
      - ./volumes/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./volumes/nginx-and-php/html:/usr/share/nginx/html

  php-svc:
    build: 
      context: .
      dockerfile: php.Dockerfile
    container_name: php-c
    volumes:
      - ./volumes/nginx-and-php/html:/usr/share/nginx/html
    env_file:
      - php-and-mysql.env

  db-svc:
    image: mysql:8.0.40
    container_name: db-c
    env_file:
      - mysql.env
      - php-and-mysql.env
    volumes:
      - ./volumes/mysql/db-contents:/var/lib/mysql
      - ./volumes/mysql/init-scripts:/docker-entrypoint-initdb.d